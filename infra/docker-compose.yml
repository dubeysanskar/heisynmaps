# Self-hosted engines for HeisynMaps on a Linux server (India region):
#   cd infra && cp .env.example .env && docker compose up -d
# Search, map tiles, fonts and PIN codes run inside the app itself (npm run setup builds them),
# so this file only adds routing (Valhalla), fleet optimisation (VROOM) and Postgres.
# On Windows/macOS without Docker, run routing with npm run engine:routing instead.

services:
  # Routing: route, matrix, isochrone, optimized_route, trace_route.
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:${VALHALLA_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./data/valhalla:/custom_files
    environment:
      # Space-separated extracts. Delhi NCR needs both zones: Delhi/Haryana (Northern) + Noida/Ghaziabad (Central).
      tile_urls: ${OSM_PBF_URLS:-https://download.geofabrik.de/asia/india/northern-zone-latest.osm.pbf https://download.geofabrik.de/asia/india/central-zone-latest.osm.pbf}
      serve_tiles: "True"
      build_admins: "True"
      build_time_zones: "True"
      build_elevation: "False"
      use_tiles_ignore_pbf: "True"
      force_rebuild: "False"
      server_threads: ${VALHALLA_THREADS:-4}

  # Optional. Search is built into the app (npm run data:search → SEARCH_DB_PATH), so Photon is only
  # needed if you prefer it: docker compose --profile photon up -d, then set PHOTON_URL and SEARCH_ENGINE=photon.
  photon:
    profiles: ["photon"]
    build: ./photon
    restart: unless-stopped
    ports:
      - "127.0.0.1:2322:2322"
    volumes:
      - ./data/photon:/photon/data
    environment:
      PHOTON_DUMP_URL: ${PHOTON_DUMP_URL:-https://download1.graphhopper.com/public/asia/india/photon-db-india-1.0-latest.tar.bz2}
      JAVA_OPTS: ${PHOTON_JAVA_OPTS:--Xmx4g}

  # Fleet VRP (capacities, time windows) on top of Valhalla.
  vroom:
    image: ghcr.io/vroom-project/vroom-docker:${VROOM_TAG:-v1.15.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./vroom:/conf
    environment:
      VROOM_ROUTER: valhalla
    depends_on:
      - valhalla

  # Production database for the API (users, keys, usage, places, geofences).
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: heisyn
      POSTGRES_USER: heisyn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}

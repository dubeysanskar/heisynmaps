# vroom-express config: VROOM solves fleet routing using Valhalla for travel times.
cliArgs:
  geometry: false
  planmode: false
  threads: 4
  explore: 5
  limit: "5mb"
  logdir: "/conf"
  logsize: "100M"
  maxlocations: 2000
  maxvehicles: 200
  override: true
  path: ""
  port: 3000
  router: "valhalla"
  timeout: 300000
  baseurl: "/"
routingServers:
  valhalla:
    auto:
      host: "valhalla"
      port: "8002"
    truck:
      host: "valhalla"
      port: "8002"
    motorcycle:
      host: "valhalla"
      port: "8002"
    motor_scooter:
      host: "valhalla"
      port: "8002"
    bicycle:
      host: "valhalla"
      port: "8002"
    pedestrian:
      host: "valhalla"
      port: "8002"
